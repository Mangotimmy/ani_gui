name: Build and Push Docker Image

# 定義何時觸發此工作流（此處設定為當 main 分支有 push 時觸發）
on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:


jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    # 1. 檢出儲存庫的程式碼
    - name: Check out the repo
      uses: actions/checkout@v6

    # 2. 設定 Docker Buildx（用於建置映像檔的高階工具）
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    # 🔥 2. 自動擷取 Docker 標籤元數據
    - name: Extract Docker metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
          images: |
            ${{ secrets.DOCKER_USERNAME }}/mangoau
            ${{ secrets.DOCKER_USERNAME }}/aniflex
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
            type=ref,event=tag
            type=sha,format=short

    # 3. 登入到 Docker Hub
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # 4. 建置並推送到 Docker Hub
    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./Dockerfile
        push: true
        # 請將「你的帳號」與「你的儲存庫名稱」替換為 Docker Hub 上的實際名稱
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/mangoau:latest
          ${{ secrets.DOCKER_USERNAME }}/aniflex:${{ github.sha }}
