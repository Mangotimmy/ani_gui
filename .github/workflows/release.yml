name: Cross-Platform Release Builder

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest
          - os: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 關鍵：拉取完整 Git 歷史與 Tags，避免 Windows 誤判

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install Linux Build Tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools

      - name: Install Dependencies
        run: npm ci

      # 關鍵：傳入 --publish always 強制執行上傳
      - name: Build & Publish Application
        run: npm run desktop:build -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}