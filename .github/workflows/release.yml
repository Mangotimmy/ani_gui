name: Release Builder

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Build exe Application
        run: npm run desktop:build
      - name: Locate Output Executables
        run: Get-ChildItem -Path . -Filter *.exe -Recurse | Select-Object FullName
      - name: Determine Tag Name for Release
        id: get_tag
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "TAG_NAME=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "TAG_NAME=v1.3.0-build-$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.TAG_NAME }}
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          # 請根據你的 electron-builder 輸出路徑調整（通常為 dist/ 或 release/）
          files: |
            dist-electron/*.exe
            dist-electron/*.blockmap
            dist-electron/latest.yml